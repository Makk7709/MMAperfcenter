name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint • Test • Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time defaults so `vite build` does not fail in CI.
      # These are publishable (non-secret) placeholder values; the real public
      # values are injected via repository / environment secrets when needed.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'public-placeholder-key' }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'example' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests (Vitest)
        run: npm run test:run

      - name: Build (production)
        run: npm run build

      # Playwright is deliberately excluded from this minimal pipeline:
      # it requires a running dev server + browsers and is documented as
      # opt-in (`npm run test:e2e`) until a dedicated e2e job is added.

  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The functions do not use npm: without this Deno reads the frontend
      # package.json and expects its node_modules.
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check supabase/functions/*/index.ts
      - name: Tests
        run: deno test --allow-env --allow-net=none tests/edge

  database:
    name: Migrations and access rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Replay migrations and check access rules
        run: ./supabase/tests/run.sh
